<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GQSHOP 搞钱商城 · 极简版</title>
    <style>
      * { box-sizing: border-box; margin: 0; }
      body { font-family: system-ui, -apple-system, "PingFang SC", sans-serif; background: #f5f6f8; color: #222; }
      header { background: #1b6dff; color: #fff; padding: 14px 20px; display: flex; align-items: center; gap: 12px; }
      header a { color: #fff; text-decoration: none; font-size: 14px; margin-left: auto; }
      main { max-width: 720px; margin: 0 auto; padding: 16px; }
      .card { background: #fff; border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
      .goods { display: flex; gap: 12px; align-items: center; cursor: pointer; }
      .price { color: #ff5722; font-weight: 700; margin-left: auto; }
      .meta { color: #999; font-size: 12px; margin-top: 4px; }
      h2 { font-size: 16px; margin-bottom: 8px; }
      select, input { padding: 8px; border: 1px solid #ddd; border-radius: 6px; width: 100%; margin: 6px 0; font-size: 14px; }
      button.primary { background: #1b6dff; color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; font-size: 15px; cursor: pointer; width: 100%; margin-top: 8px; }
      .msg { padding: 10px; border-radius: 8px; background: #eef5ff; color: #1b6dff; font-size: 14px; margin: 8px 0; word-break: break-all; }
      a.back { color: #1b6dff; text-decoration: none; font-size: 14px; display: inline-block; margin-bottom: 10px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
